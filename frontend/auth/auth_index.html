<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../Img/Logo.png">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="auth_style.css">
    
    <title>Autenticação - Sistema</title>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title" id="authTitle">Acessar Nexus</h1>
            <p class="auth-subtitle" id="authSubtitle">Entre com suas credenciais para continuar</p>
        </div>

        <div class="auth-tabs" id="authTabs">
            <button class="auth-tab active" id="tabLoginBtn" onclick="switchTab('login')">Entrar</button>
            <button class="auth-tab" id="tabRegisterBtn" onclick="switchTab('register')">Cadastrar</button>
        </div>

        <!-- LOGIN -->
        <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-alert" id="loginAlert" style="display: none;">
                <i class="fa-solid" id="loginAlertIcon"></i>
                <span id="loginAlertText"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="loginEmail">E-mail</label>
                <input class="form-input" type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="loginPassword">Senha</label>
                <div class="containe_password">
                    <input class="form-input" type="password" id="loginPassword" placeholder="••••••••" required>
                    <button type="button" class="btn_toggle_pass" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="auth-forgot-container">
                <a href="#" class="auth-forgot-link" onclick="openForgotPassword(event)">Esqueceu a senha?</a>
            </div>
            <button type="submit" class="btn-submit">Entrar na Plataforma</button>
            <p class="auth-footer-text">Não tem uma conta? <a onclick="switchTab('register')">Cadastre-se</a></p>
        </form>

        <!-- CADASTRO -->
        <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-alert" id="registerAlert" style="display: none;">
                <i class="fa-solid" id="registerAlertIcon"></i>
                <span id="registerAlertText"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="regUser">Usuário</label>
                <input class="form-input" type="text" id="regUser" placeholder="Seu nome de usuário" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="regEmail">E-mail</label>
                <input class="form-input" type="email" id="regEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="regPassword">Senha</label>
                <div class="containe_password">
                    <input class="form-input" type="password" id="regPassword" placeholder="••••••••" required>
                    <button type="button" class="btn_toggle_pass" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="regConfirmPassword">Confirmação de Senha</label>
                <div class="containe_password">
                    <input class="form-input" type="password" id="regConfirmPassword" placeholder="••••••••" required>
                    <button type="button" class="btn_toggle_pass" onclick="togglePassword(this)">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Criar Conta</button>
            <p class="auth-footer-text">Já possui uma conta? <a onclick="switchTab('login')">Faça login</a></p>
        </form>

        <!-- REDEFINIÇÃO DE SENHA -->
        <form class="auth-form" id="resetForm" onsubmit="handleUpdatePassword(event)">
            <div class="form-alert" id="resetAlert" style="display: none;">
                <i class="fa-solid" id="resetAlertIcon"></i>
                <span id="resetAlertText"></span>
            </div>

            <div class="form-group">
                <label class="form-label" for="newPassword">Nova senha</label>
                <input class="form-input" type="password" id="newPassword" minlength="8" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmNewPassword">Confirmar nova senha</label>
                <input class="form-input" type="password" id="confirmNewPassword" minlength="8" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn-submit">Atualizar senha</button>
        </form>
    </div>

    <!-- BIBLIOTECA -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/supabase-client.js"></script>
    <script src="auth_code.js"></script>
</body>
</html>
